[versions]
lombok = "1.18.38"
guice = "7.0.0"
vavr = "1.0.1"
bcrypt = "0.10.2"
jackson = "2.19.0"
asm = "9.9.1"
javafx = "26.0.2"
controlsfx = "11.2.4"
ikonli = "12.4.0"
logback = "1.5.18"
junit = "5.9.2"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
vavr = { module = "io.vavr:vavr", version.ref = "vavr" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-csv = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-csv", version.ref = "jackson" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-fxml = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
controlsfx = { module = "org.controlsfx:controlsfx", version.ref = "controlsfx" }
ikonli-core = { module = "org.kordamp.ikonli:ikonli-core", version.ref = "ikonli" }
ikonli-fontawesome5 = { module = "org.kordamp.ikonli:ikonli-fontawesome5-pack", version.ref = "ikonli" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.9.2" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
